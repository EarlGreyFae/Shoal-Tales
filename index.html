<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoreline Dredge</title>
<style>
:root{--bg:#0e1f2b;--panel:#16303f;--panel2:#1d3d50;--ink:#e8f1f5;--dim:#8fb0bf;--accent:#f2b84b;--good:#5fd39a;--bad:#ef6a6a;--line:#2a5068}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:10px 16px;background:#0a161f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--accent)}
.stat b{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
nav button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
nav button.on{background:var(--accent);color:#1a1200;font-weight:600}
nav button.lock{opacity:.4}
main{padding:0 16px 40px;max-width:980px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
h2{margin:0 0 8px;font-size:16px}
button.b{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;margin:2px}
button.b:hover:not(:disabled){border-color:var(--accent)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button.big{background:var(--accent);color:#1a1200;font-weight:700;font-size:17px;padding:12px 26px;border:0;border-radius:10px;cursor:pointer}
button.big:disabled{opacity:.4;cursor:not-allowed}
.bar{height:14px;background:#0a161f;border-radius:7px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;width:0;background:var(--good)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:110px;cursor:pointer;text-align:center}
.item.sel{border-color:var(--accent)}
.item .e{font-size:30px}
.item small{display:block;color:var(--dim)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.bin{background:#0f2735;border:2px dashed var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.bin:hover{border-color:var(--accent)}
.dim{color:var(--dim)}
.good{color:var(--good)}.bad{color:var(--bad)}
.rar-uncommon{color:#6fc3ff}.rar-rare{color:#c58bff}.rar-epic{color:#ffb347}
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;max-width:320px;z-index:20}
.toast{background:#0a161f;border:1px solid var(--accent);border-radius:8px;padding:8px 12px;animation:f 4s forwards}
@keyframes f{0%,80%{opacity:1}100%{opacity:0}}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:520px;width:100%;background:#f4ead2;color:#3b2f1c;font-family:Georgia,serif}
.modal .card .b{color:#3b2f1c;background:#e6d8b5}
textarea{width:100%;min-height:110px;background:#0a161f;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
</style>
</head>
<body>
<header>
  <h1>🌊 Shoreline Dredge</h1>
  <span class="stat">💰 <b id="hCoins"></b></span>
  <span class="stat">🔥 Sort streak <b id="hStreak"></b></span>
  <span class="stat">✨ Payout ×<b id="hMult"></b></span>
  <span class="stat" id="hTitle"></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toasts"></div>
<div id="modal"></div>
<script>
'use strict';
/* ---------- data ---------- */
const BINS={plastic:{n:'Plastic',e:'🧴',p:2},metal:{n:'Metal',e:'🔩',p:4},wood:{n:'Wood',e:'🪵',p:3},electronics:{n:'Electronics',e:'💾',p:8},hazardous:{n:'Hazardous',e:'☣️',p:6},mixed:{n:'Mixed',e:'🗑️',p:1}};
const JUNK=[
['Plastic bag','🛍️','plastic'],['Soda bottle','🥤','plastic'],['Six-pack ring','⭕','plastic'],['Bucket','🪣','plastic'],
['Scrap sheet','🔩','metal'],['Tin can','🥫','metal'],['Old anchor','⚓','metal'],['Rusty hand tools','🔧','metal'],['Sunken equipment','⚙️','metal'],
['Driftwood','🪵','wood'],['Broken chair','🪑','wood'],['Plank','📏','wood'],['Water-logged sofa','🛋️','wood'],
['Radio','📻','electronics'],['Circuit board','💾','electronics'],['Old phone','📱','electronics'],
['Leaking barrel','🛢️','hazardous'],['Battery','🔋','hazardous'],['Chemical jug','🧪','hazardous'],
['Tangled trash','🗑️','mixed'],['Soggy clothing','👕','mixed'],['Sunken bundle','🧺','mixed']];
const FISH=[['Sardine','🐟',6],['Snapper','🐠',10],['Squid','🦑',14],['Crab','🦀',16],['Kelp','🌿',5],['Octopus','🐙',24],['Lobster','🦞',30]];
const CURIOS=[['Jewelry','💍'],['Vase','🏺'],['Compass','🧭'],['Mantel clock','🕰️'],['Little idol','🗿'],['Urn','⚱️'],['Knick-knack','🧸'],['Music box','🎼'],['Old coin','🪙'],['Spyglass','🔭']];
const ANIMALS=[['Sea turtle','🐢'],['Seal pup','🦭'],['Duck','🦆'],['Eel','🐍']];
const RARITY=[['common',1,60],['uncommon',2.5,25],['rare',6,11],['epic',15,4]];
const MAGIC=[
{id:'pearl',n:'Tideglass Pearl',e:'🫧',d:'+5% payout'},
{id:'tooth',n:"Kraken's Tooth",e:'🦷',d:'−5% dredge time'},
{id:'lantern',n:'Moonlit Lantern',e:'🏮',d:'+1 basket slot'},
{id:'crown',n:'Coral Crown',e:'👑',d:'+15% curio value'},
{id:'compass',n:'Storm Compass',e:'🧭',d:'Better curio rarity'},
{id:'heart',n:'Heart of the Shore',e:'💙',d:'+10% payout'}];
const DEPTHS=[{n:'Shallows',cost:0,m:1,w:{junk:56,fish:14,curio:7,crate:5,bottle:6,animal:6}},
{n:'Coral Reef',cost:200,m:1.5,w:{junk:42,fish:26,curio:12,crate:6,bottle:7,animal:7}},
{n:'Deep Trench',cost:800,m:2.2,w:{junk:46,fish:14,curio:18,crate:8,bottle:7,animal:7}},
{n:'The Abyss',cost:3000,m:3.5,w:{junk:38,fish:14,curio:24,crate:10,bottle:8,animal:6}}];
const UPS={speed:{n:'Faster winch',d:'Dredge time −12%',base:60,g:1.9,max:8},basket:{n:'Bigger basket',d:'+1 item per haul',base:80,g:2,max:6},clean:{n:'Soft brush',d:'Fewer clicks to clean',base:100,g:2.5,max:3},luck:{n:'Lucky charm',d:'Better rarity & magic odds',base:120,g:2.2,max:5}};
const STATIONS={oven:{n:'Oven',e:'🔥',cost:150,d:'Cooks dressed fish into meals.'},crucible:{n:'Crucible',e:'🌋',cost:300,d:'Melts the metal bin into ingots.'},carpentry:{n:'Carpentry Bench',e:'🪚',cost:250,d:'Turns the wood bin into knick-knacks.'},recycler:{n:'Recycling Machine',e:'♻️',cost:500,d:'Breaks the mixed bin into base materials.'}};
const GOODS={fish_raw:['Fish (raw)','🐟',1],fish_dressed:['Dressed fish','🍣',1],meal:['Meals','🍲',1],ingot:['Ingots','🧱',1],knick:['Carved knick-knacks','🪆',1],material:['Base materials','📦',1]};
const BINS_KEYS=Object.keys(BINS);
const RECIPES=[
{st:'cut',n:'Cutting Board',e:'🔪',from:'fish_raw',to:'fish_dressed',f:1.6,d:'Dress fish for a better price.'},
{st:'oven',n:'Oven',e:'🔥',from:'fish_dressed',to:'meal',f:2.2,d:'Cook dressed fish into meals.'},
{st:'crucible',n:'Crucible',e:'🌋',from:'bin_metal',to:'ingot',f:2.5,d:'Melt metal into ingots.'},
{st:'carpentry',n:'Carpentry Bench',e:'🪚',from:'bin_wood',to:'knick',f:2.2,d:'Build knick-knacks from wood.'},
{st:'recycler',n:'Recycling Machine',e:'♻️',from:'bin_mixed',to:'material',f:3,d:'Reduce mixed trash to materials.'}];
// PLACEHOLDER lore - replace with your own letters
const LETTERS=[
{id:'d1',dev:1,from:'The Harbourmaster',t:'If you are reading this, the tide brought you. Good. The shore has been waiting for someone with patient hands.'},
{id:'d2',dev:1,from:'The Harbourmaster',t:'The village sits where three shores fold together. Bring what you pull from the deep and they will remember your name.'},
{id:'d3',dev:1,from:'The Harbourmaster',t:'A fisherman is only a craftsman who has not yet learned what the sea is offering. Sort well. Waste nothing.'},
{id:'d4',dev:1,from:'The Harbourmaster',t:'There are six lights lost in the water. Find them all and the shore will open a fourth door.'},
{id:'d5',dev:1,from:'The Harbourmaster',t:'When you have everything, begin again. The second tide is always kinder to the one who has walked the first.'}];
const SEED_COMMUNITY=[
{id:'c1',from:'Anonymous',t:'To whoever finds this: the sunset from my porch is the best thing I own. Go watch one today.',score:2},
{id:'c2',from:'Anonymous',t:'My OC Marlo wants you to know the kelp is NOT haunted. Ignore the humming.',score:1},
{id:'c3',from:'Anonymous',t:'Drink some water and stretch. Yes, you. Right now.',score:3}];
const TITLES=['Deckhand','Dredger','Salvager','Tidewright','Shorewarden','Harbour Legend'];

/* ---------- state ---------- */
const KEY='shoreline-dredge-v1';
const fresh=()=>({coins:0,life:0,goods:{},tray:[],sel:null,depth:0,unlocked:[1,0,0,0],up:{speed:0,basket:0,clean:0,luck:0},st:{},dredge:null,streak:0,best:0,tab:'dredge',sub:'library',uid:1,hauls:0});
const persist=()=>({log:{},magic:[],seen:[],votes:{},outbox:[],tos:false,prestige:0});
let S=Object.assign(fresh(),persist());
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let reading=null,writing=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString();
const hasM=id=>S.magic.includes(id);
const luck=()=>S.up.luck+(hasM('compass')?2:0);
const complete=()=>S.magic.length===MAGIC.length;
const gMult=()=>(1+0.1*S.prestige)*DEPTHS[S.depth].m*(1+(hasM('pearl')?.05:0)+(hasM('heart')?.1:0)+(complete()?.25:0));
const streakMult=()=>1+0.05*Math.min(S.streak,20);
const dredgeMs=()=>6000*Math.pow(.88,S.up.speed)*(1-Math.min(.5,.03*S.prestige))*(hasM('tooth')?.95:1);
const basket=()=>3+S.up.basket+(hasM('lantern')?1:0);
const cleanClicks=()=>Math.max(1,4-S.up.clean);
const upCost=k=>Math.round(UPS[k].base*Math.pow(UPS[k].g,S.up[k]));
const prestigeGoal=()=>Math.round(6000*Math.pow(2.2,S.prestige));
const title=()=>TITLES[Math.min(S.prestige,TITLES.length-1)];
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),4000)}
function earn(n){S.coins+=n;S.life+=n}
function add(g,n,v){const o=S.goods[g]||(S.goods[g]={n:0,v:0});o.n+=n;o.v+=v}

/* ---------- loot ---------- */
function pickKind(){const w=DEPTHS[S.depth].w;let t=Object.values(w).reduce((a,b)=>a+b,0)*Math.random();for(const k in w){if((t-=w[k])<0)return k}return'junk'}
function newItem(kind){
  const it={uid:S.uid++,kind};
  if(kind==='junk'){const j=R(JUNK);Object.assign(it,{name:j[0],e:j[1],bin:j[2],base:BINS[j[2]].p*(1+Math.random()*.5)})}
  else if(kind==='fish'){const f=R(FISH);Object.assign(it,{name:f[0],e:f[1],base:f[2]*(.8+Math.random()*.6)})}
  else if(kind==='curio'){const c=R(CURIOS);Object.assign(it,{name:c[0],e:c[1],base:12+Math.random()*10,clicks:0,done:false})}
  else if(kind==='crate')Object.assign(it,{name:'Crate',e:'📦'});
  else if(kind==='bottle')Object.assign(it,{name:'Bottle',e:'🍾'});
  else if(kind==='animal'){const a=R(ANIMALS);Object.assign(it,{name:a[0]+' (tangled)',e:a[1]})}
  return it}
function haul(){
  const out=[];
  for(let i=0;i<basket();i++){
    let k=pickKind();
    if(Math.random()<.006*(1+S.depth)*(1+luck()*.4)&&S.magic.length<MAGIC.length)k='magic';
    out.push(k==='magic'?{uid:S.uid++,kind:'curio',magic:1,name:'Strange glowing curio',e:'✨',base:0,clicks:0,done:false}:newItem(k));
  }
  return out}

/* ---------- actions ---------- */
const A={
tab(t){S.tab=t},
sub(t){S.sub=t},
dredge(){if(S.dredge||S.tray.length)return;S.dredge={end:Date.now()+dredgeMs()}},
sel(u){S.sel=+u},
bin(t){
  const it=S.tray.find(i=>i.uid===S.sel);if(!it||it.kind!=='junk')return toast('Select a piece of junk first.');
  if(it.bin===t){const v=it.base*streakMult()*gMult();add('bin_'+t,1,v);S.streak++;S.best=Math.max(S.best,S.streak)}
  else{add('bin_'+t,1,it.base*.4*gMult());S.streak=0;toast('Wrong bin! '+it.name+' belongs in '+BINS[it.bin].n+'. Streak lost.');if(it.bin==='hazardous'){S.coins=Math.max(0,S.coins-15);toast('Hazmat fine: −15')}}
  drop(it)},
clean(u){
  const it=S.tray.find(i=>i.uid===+u);if(!it||it.done)return;
  if(++it.clicks<cleanClicks())return;
  it.done=true;
  if(it.magic){const left=MAGIC.filter(m=>!hasM(m.id));const m=R(left);S.magic.push(m.id);toast('✨ MAGIC CURIO: '+m.n+' — '+m.d);if(complete())toast('🏆 Full magic set! +25% payout & a new title path.');drop(it);return}
  let roll=Math.random()*100-luck()*3,r=RARITY[0];
  for(let i=RARITY.length-1;i>=0;i--){const th=RARITY.slice(i).reduce((a,x)=>a+x[2],0);if(roll<th){r=RARITY[i];break}}
  it.rar=r[0];it.value=it.base*r[1]*(1+(hasM('crown')?.15:0))},
curioSell(u){const it=S.tray.find(i=>i.uid===+u);earn(it.value*gMult());toast('Sold '+it.name+' for '+fmt(it.value*gMult()));drop(it)},
curioKeep(u){const it=S.tray.find(i=>i.uid===+u);const o=S.log[it.name];
  if(!o||RARITY.findIndex(r=>r[0]===it.rar)>RARITY.findIndex(r=>r[0]===o)){S.log[it.name]=it.rar;earn(it.value*.25);toast('Added to Collector\'s Log: '+it.rar+' '+it.name)}else{earn(it.value*gMult());toast('Already have that or better — sold for '+fmt(it.value*gMult()))}
  drop(it)},
fishSell(u){const it=S.tray.find(i=>i.uid===+u);earn(it.base*gMult());drop(it)},
fishStore(u){const it=S.tray.find(i=>i.uid===+u);add('fish_raw',1,it.base*gMult());drop(it)},
crate(u){const it=S.tray.find(i=>i.uid===+u);drop(it);const r=Math.random();
  if(r<.5){const c=(20+Math.random()*60)*(1+S.depth);earn(c);toast('Crate: '+fmt(c)+' coins!')}
  else if(r<.85){S.tray.push(newItem('junk'),newItem('junk'));toast('Crate: two more pieces of junk.')}
  else{const c=newItem('curio');S.tray.push(c);toast('Crate: a curio!')}},
bottle(u){const it=S.tray.find(i=>i.uid===+u);
  if(Math.random()<.3){it.kind='empty';it.name='Empty bottle';it.e='🫙';return}
  const unseen=LETTERS.filter(l=>!S.seen.includes(l.id));
  const comm=SEED_COMMUNITY.concat(S.outbox.filter(o=>o.approved)).filter(l=>!S.seen.includes(l.id)&&score(l)>-3);
  let l=(unseen.length&&Math.random()<.5)?R(unseen):(comm.length?R(comm):(unseen.length?R(unseen):R(LETTERS)));
  if(!S.seen.includes(l.id))S.seen.push(l.id);reading=l;drop(it)},
emptySell(u){const it=S.tray.find(i=>i.uid===+u);earn(3*gMult());drop(it)},
emptyKeep(u){const it=S.tray.find(i=>i.uid===+u);S.empties=(S.empties||0)+1;toast('Saved an empty bottle for the Desk.');drop(it)},
animal(u){const it=S.tray.find(i=>i.uid===+u);earn(3);toast('The '+it.name.split(' (')[0]+' swims off happily.');drop(it)},
proc(i){const r=RECIPES[+i],o=S.goods[r.from];if(!o||!o.n)return;add(r.to,o.n,o.v*r.f);delete S.goods[r.from];toast('Processed → '+(GOODS[r.to]?GOODS[r.to][0]:r.to))},
sell(g){const o=S.goods[g];if(!o)return;earn(o.v);toast('Sold '+o.n+' for '+fmt(o.v));delete S.goods[g]},
sellAll(){let t=0;for(const g in S.goods)t+=S.goods[g].v;earn(t);S.goods={};toast('Sold everything for '+fmt(t))},
up(k){const c=upCost(k);if(S.coins<c||S.up[k]>=UPS[k].max)return;S.coins-=c;S.up[k]++},
station(k){const s=STATIONS[k];if(S.coins<s.cost||S.st[k])return;S.coins-=s.cost;S.st[k]=1;toast('Built the '+s.n)},
depth(i){i=+i;if(S.unlocked[i]){S.depth=i;return}const c=DEPTHS[i].cost;if(S.coins<c||!S.unlocked[i-1])return;S.coins-=c;S.unlocked[i]=1;S.depth=i;toast('Charted '+DEPTHS[i].n)},
prestige(){if(S.life<prestigeGoal())return;if(!confirm('Retire this vessel and start again? You keep your log, letters, magic curios and get permanent bonuses.'))return;
  const keep={log:S.log,magic:S.magic,seen:S.seen,votes:S.votes,outbox:S.outbox,tos:S.tos,prestige:S.prestige+1,empties:S.empties};
  S=Object.assign(fresh(),keep,{tab:'work'});toast('New tide begins. You are now a '+title()+'.')},
tos(){S.tos=true;writing=true},
write(){writing=true},
send(){const t=$('#letter').value.trim();if(!t)return;if(S.outbox.filter(o=>!o.approved).length>=3)return toast('You can only have 3 letters awaiting review.');
  if(!(S.empties>0))return toast('You need an empty bottle from the sea first.');
  S.empties--;S.outbox.push({id:'u'+Date.now(),from:$('#sign').checked?'You':'Anonymous',t:t.slice(0,400),score:0,approved:false,mine:1});writing=false;toast('Bottle sent to the moderation queue (local demo).')},
vote(a){const[id,v]=a.split(':');S.votes[id]=S.votes[id]===+v?0:+v},
closeModal(){reading=null;writing=false}
};
function drop(it){S.tray=S.tray.filter(i=>i!==it);if(S.sel===it.uid)S.sel=null}
const score=l=>(l.score||0)+(S.votes[l.id]||0);

/* ---------- render ---------- */
const TABS=[['dredge','⚓ Dredge'],['storage','📦 Storage'],['craft','🔨 Stations'],['desk','🗒️ Desk'],['work','🛠️ Work Table'],['map','🗺️ Map'],['guild','🤝 Guild']];
function itemCard(it){
  const sel=S.sel===it.uid?' sel':'';
  let sub='',btn='';
  const b=(a,l)=>`<button class="b" data-act="${a}" data-arg="${it.uid}">${l}</button>`;
  if(it.kind==='junk')sub='needs sorting';
  if(it.kind==='fish')btn=b('fishStore','Store')+b('fishSell','Sell now');
  if(it.kind==='curio'){if(!it.done){sub=`dirty (${it.clicks}/${cleanClicks()})`;btn=b('clean','Clean')}else{sub=`<span class="rar-${it.rar}">${it.rar} · ${fmt(it.value*gMult())}c</span>`;btn=b('curioKeep','To Log')+b('curioSell','Sell')}}
  if(it.kind==='crate')btn=b('crate','Open');
  if(it.kind==='bottle')btn=b('bottle','Open');
  if(it.kind==='empty')btn=b('emptyKeep','Keep')+b('emptySell','Recycle');
  if(it.kind==='animal')btn=b('animal','Set free');
  return`<div class="item${sel}" ${it.kind==='junk'?`data-act="sel" data-arg="${it.uid}"`:''}><div class="e">${it.e}</div>${esc(it.name)}<small>${sub}</small>${btn}</div>`}
function pDredge(){
  const d=S.dredge;
  let h=`<div class="card"><h2>${DEPTHS[S.depth].n} · basket ${basket()} items</h2>
  <button class="big" data-act="dredge" ${d||S.tray.length?'disabled':''}>${d?'Dredging…':S.tray.length?'Sort your catch first':'Drop the dredge'}</button>
  <div class="bar"><i id="prog"></i></div></div>`;
  if(S.tray.length)h+=`<div class="card"><h2>Catch — clear it all to dredge again</h2><div class="tray">${S.tray.map(itemCard).join('')}</div>
  <p class="dim">Click a piece of junk, then the correct bin. Correct sorts in a row raise your payout multiplier (now ×${streakMult().toFixed(2)}).</p>
  <div class="bins">${BINS_KEYS.map(k=>`<div class="bin" data-act="bin" data-arg="${k}"><div style="font-size:26px">${BINS[k].e}</div>${BINS[k].n}<small class="dim"><br>${fmt((S.goods['bin_'+k]||{n:0}).n)} sorted</small></div>`).join('')}</div></div>`;
  else h+=`<div class="card dim">The tray is empty. Head to Storage or Stations to sell or process what you've sorted, or drop the dredge again.</div>`;
  return h}
function pStorage(){
  const rows=Object.keys(S.goods).map(g=>{const o=S.goods[g];const nm=g.startsWith('bin_')?BINS[g.slice(4)].e+' '+BINS[g.slice(4)].n+' bin':(GOODS[g][1]+' '+GOODS[g][0]);
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${nm} ×${o.n}</span><span>${fmt(o.v)}c <button class="b" data-act="sell" data-arg="${g}">Sell</button></span></div>`}).join('');
  return`<div class="card"><h2>Ship storage</h2>${rows||'<span class="dim">Nothing stored. Sort some junk first.</span>'}
  ${rows?'<hr style="border-color:var(--line)"><button class="b" data-act="sellAll">Sell everything</button>':''}</div>
  <div class="card dim">Tip: sorted bins pay more when fed through a station first. You must unlock full crafting to progress from selling to breaking everything down.</div>`}
function pCraft(){
  return RECIPES.map((r,i)=>{const own=r.st==='cut'||S.st[r.st];
    if(!own){const s=STATIONS[r.st];return`<div class="card"><h2>${s.e} ${s.n} <span class="dim">(locked)</span></h2>${s.d}<br><button class="b" data-act="station" data-arg="${r.st}" ${S.coins<s.cost?'disabled':''}>Build — ${s.cost}c</button></div>`}
    const o=S.goods[r.from];const nm=r.from.startsWith('bin_')?BINS[r.from.slice(4)].n+' bin':GOODS[r.from][0];
    return`<div class="card"><h2>${r.e} ${r.n}</h2>${r.d}<br>Input: ${nm} — ${o?o.n+' units':'none'} · Output value ×${r.f}<br><button class="b" data-act="proc" data-arg="${i}" ${o?'':'disabled'}>Process all</button></div>`}).join('')}
function pDesk(){
  const subs=[['library','Letters'],['log','Collector\'s Log'],['magic','Magic Curios'],['tos','Rules']];
  let h=`<div class="card">${subs.map(s=>`<button class="b" data-act="sub" data-arg="${s[0]}" ${S.sub===s[0]?'style="border-color:var(--accent)"':''}>${s[1]}</button>`).join('')}</div>`;
  if(S.sub==='library'){
    const all=LETTERS.concat(SEED_COMMUNITY,S.outbox).filter(l=>S.seen.includes(l.id)||l.mine);
    h+=`<div class="card"><h2>Letter library (${S.seen.length} found)</h2>${all.map(l=>`<div class="card" style="background:var(--panel2)"><b>${l.dev?'🖋 Lore Letter · '+esc(l.from):'✉️ '+esc(l.from)}</b>${l.mine?` <span class="dim">${l.approved?'(approved)':'(awaiting review)'}</span>`:''}<p>${esc(l.t)}</p>
    ${l.dev||l.mine?'':`<button class="b" data-act="vote" data-arg="${l.id}:1">👍</button><button class="b" data-act="vote" data-arg="${l.id}:-1">👎</button> <span class="dim">score ${score(l)}${score(l)<=-3?' · hidden from bottles':''}</span>`}</div>`).join('')||'<span class="dim">No letters yet. Dredge up some bottles.</span>'}
    <p>Empty bottles saved: ${S.empties||0} · <button class="b" data-act="writeStart">Write a letter</button></p></div>`}
  if(S.sub==='log')h+=`<div class="card"><h2>Collector's Log</h2><div class="grid">${CURIOS.map(c=>{const r=S.log[c[0]];return`<div class="card" style="background:var(--panel2)">${r?c[1]:'❔'} ${r?c[0]:'???'}<br><small class="${r?'rar-'+r:'dim'}">${r||'not found'}</small></div>`}).join('')}</div></div>`;
  if(S.sub==='magic')h+=`<div class="card"><h2>Magic Curios ${S.magic.length}/${MAGIC.length}</h2><div class="grid">${MAGIC.map(m=>`<div class="card" style="background:var(--panel2)">${hasM(m.id)?m.e+' '+m.n+'<br><small class="good">'+m.d+'</small>':'❔ ???'}</div>`).join('')}</div><p class="dim">Full set: +25% payout permanently.</p></div>`;
  if(S.sub==='tos')h+=`<div class="card"><h2>Rules of the shore</h2><p>This game is for fun. Fun is earned; trust once lost takes the fun away.</p><ul>
  <li>Letters are shown as anonymous, but the developer can see your handle for moderation. You may sign your own letter if you choose.</li>
  <li>Write safe, read safe. Never share personal information, contact details, or anything hateful or unsafe.</li>
  <li>Letters can be audited. By sending one you accept that risk and responsibility.</li>
  <li>You may have at most 3 letters awaiting review at once.</li></ul></div>`;
  if(S.sub==='tos'&&false){}
  return h}
function pWork(){
  let h=Object.keys(UPS).map(k=>{const u=UPS[k],c=upCost(k),mx=S.up[k]>=u.max;return`<div class="card"><h2>${u.n} <span class="dim">lv ${S.up[k]}/${u.max}</span></h2>${u.d}<br><button class="b" data-act="up" data-arg="${k}" ${mx||S.coins<c?'disabled':''}>${mx?'Maxed':'Upgrade — '+fmt(c)+'c'}</button></div>`}).join('');
  h+=`<div class="card"><h2>🌅 Retire the vessel (prestige ${S.prestige})</h2>Earn ${fmt(prestigeGoal())} lifetime coins this run (${fmt(S.life)} so far). Reset coins, upgrades and stations; keep log, letters, magic curios. Each retirement: +10% payout, −3% dredge time, and a new title.<br>
  <button class="b" data-act="prestige" ${S.life<prestigeGoal()?'disabled':''}>Begin a new tide</button></div>`;
  return h}
function pMap(){return DEPTHS.map((d,i)=>`<div class="card"><h2>${d.n} ${S.depth===i?'<span class="good">(current)</span>':''}</h2>Payout ×${d.m}<br><button class="b" data-act="depth" data-arg="${i}" ${S.depth===i||(!S.unlocked[i]&&(S.coins<d.cost||!S.unlocked[i-1]))?'disabled':''}>${S.unlocked[i]?'Sail here':'Chart it — '+d.cost+'c'}</button></div>`).join('')}
function pGuild(){return`<div class="card"><h2>🤝 Guild Manifest</h2><p>Guilds, parties, shared quests, guild chat and the peer-to-peer bottle network need an online backend with accounts and moderation, which this single-file prototype doesn't have yet.</p><p class="dim">Planned: guilds with turn-in quests, parties (timed bonus when online together), guild/party-only collectibles. Letters currently use a local seed pool and a local review queue.</p></div>`}
const PAN={dredge:pDredge,storage:pStorage,craft:pCraft,desk:pDesk,work:pWork,map:pMap,guild:pGuild};

function render(){
  $('#hCoins').textContent=fmt(S.coins);$('#hStreak').textContent=S.streak;$('#hMult').textContent=(gMult()*streakMult()).toFixed(2);$('#hTitle').textContent='🏅 '+title()+(S.prestige?' ★'+S.prestige:'');
  $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="tab" data-arg="${t[0]}">${t[1]}</button>`).join('');
  $('#main').innerHTML=PAN[S.tab]();
  let m='';
  if(reading)m=`<div class="modal"><div class="card"><b>${reading.dev?'🖋 Lore Letter from '+esc(reading.from):'✉️ Letter from '+esc(reading.from)}</b><p style="font-size:17px">${esc(reading.t)}</p><button class="b" data-act="closeModal">Fold it away</button></div></div>`;
  else if(writing)m=`<div class="modal"><div class="card"><b>Write a letter</b>
    <p style="font-size:13px">⚠️ Security notice: letters are shown to strangers and can be audited by the developer (who can see your handle). Never include personal info. By sending you accept the Rules of the shore.</p>
    <textarea id="letter" maxlength="400" placeholder="Dear stranger…"></textarea><label><input type="checkbox" id="sign"> Sign with my name instead of anonymous</label><br>
    <button class="b" data-act="send">Send bottle</button><button class="b" data-act="closeModal">Cancel</button></div></div>`;
  $('#modal').innerHTML=m;
  save()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,arg=el.dataset.arg;
  if(a==='writeStart'){if(!S.tos&&!confirm('Before writing: letters are shown to strangers and can be audited (the developer can see your handle). Never share personal info. Do you accept the Rules of the shore (Desk → Rules) and that risk?'))return;S.tos=true;writing=true;render();return}
  A[a]&&A[a](arg);render()});

/* dredge timer */
setInterval(()=>{
  const d=S.dredge;if(!d)return;
  const left=d.end-Date.now(),total=dredgeMs(),p=Math.min(100,100-left/total*100);
  const bar=$('#prog');if(bar)bar.style.width=Math.max(0,p)+'%';
  if(left<=0){S.dredge=null;S.hauls++;S.tray=haul();S.sel=null;S.tab=S.tab==='dredge'?'dredge':S.tab;toast('The basket lifts…');render()}
},100);
render();
</script>
</body>
</html>
